# Finnie application settings.
# Secrets (API keys) and the provider choice live in .env; see .env.example.
# Relative paths are resolved against the project root.

app:
  name: Finnie
  log_level: INFO          # DEBUG | INFO | WARNING | ERROR
  log_format: json         # json | text
  data_path: data/app/finnie.sqlite   # profile, portfolio, conversations per browser (never committed)
  disclaimer: >-
    Finnie provides educational information only, not financial, investment, tax,
    or legal advice. Consult a qualified professional before making financial decisions.

llm:
  temperature: 0.2
  max_tokens: 2048
  timeout_s: 60
  max_retries: 3           # SDK-level retries with exponential backoff (429, 5xx, timeouts)
  providers:
    openai:
      main: { model: gpt-4o }
      fast: { model: gpt-4o-mini }
    anthropic:
      main: { model: claude-sonnet-5-5 }
      fast: { model: claude-haiku-4-5-20251001 }

rag:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  knowledge_base_dir: data/knowledge_base
  index_dir: data/vectorstore
  chunk_size: 800
  chunk_overlap: 120
  top_k: 4
  fetch_k: 40
  score_threshold: 0.40          # tuned on tests/evals: off-topic max 0.28, weakest real hit 0.51
  mmr_lambda: 0.7
  max_chunks_per_article: 2

market_data:
  cache_path: data/cache/market.sqlite
  quote_ttl_minutes: 30        # cached quote lifetime while the market is closed (never older than the last close)
  quote_live_ttl_seconds: 60   # while the market is open
  news_ttl_minutes: 30
  history_ttl_hours: 12
  request_timeout_s: 10
  batch_threshold: 3        # fetch this many uncached quotes in one yfinance batch call
  alpha_vantage:
    requests_per_minute: 5
    daily_budget: 25
  backoff:
    max_attempts: 3
    initial_s: 1.0
    multiplier: 2.0
    max_s: 10.0

workflow:
  max_stages: 3
  max_agents_per_turn: 3
  agent_max_iterations: 4
  history_window: 20
  summarize_after: 30
  turn_timeout_s: 120
  router_min_confidence: 0.5

analytics:
  risk_free_rate: 0.042          # fallback for Sharpe ratio when the live ^IRX T-bill yield is unavailable
  trading_days_per_year: 252
  concentration_threshold: 0.20  # single-company weight that triggers a concentration note
  sector_concentration_threshold: 0.40
  high_expense_ratio: 0.005      # 0.50%
  fee_growth_rate: 0.06          # assumed annual growth for fee-drag illustrations
  min_history_days: 60           # fewer daily returns than this -> skip risk metrics
  history_days: 252
  benchmark: SPY
  monte_carlo:
    simulations: 10000
    t_degrees_of_freedom: 5      # fatter tails than a normal distribution
    inflation: 0.025
    target_success_probability: 0.80

mcp:
  host: 127.0.0.1          # Streamable HTTP binds to localhost only
  port: 8765
  path: /mcp
  min_token_length: 32     # MCP_API_TOKEN (in .env) must be at least this long

voice:
  enabled: true            # the microphone in the chat box (needs OPENAI_API_KEY)
  model: whisper-1         # OpenAI transcription model this key can use (checked 2026-10-04)
  language: en
  timeout_s: 30
