[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finnie"
version = "0.1.0"
description = "Finnie: a multi-agent AI finance education assistant"
readme = "README.md"
requires-python = ">=3.12"
# Dependencies live in requirements.txt (it pins CPU-only PyTorch via an extra index,
# which setuptools metadata can't express). Install: pip install -r requirements.txt
dependencies = []

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network is blocked except loopback; tests must mock every external API.
addopts = [
    "-ra",
    "--strict-markers",
    "--allow-hosts=127.0.0.1,::1",
    "-m", "not live and not slow",
    "--cov=src",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
]
markers = [
    "live: calls real external APIs (opt-in: pytest -m live)",
    "slow: loads real models or large data",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    'if __name__ == "__main__":',
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs/ik"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/core", "src/data", "src/utils", "src/rag"]
