# Security classification used by portfolio analysis.
#
# type:        stock | etf | mutual_fund | money_market | cash
# asset_class: equity | bond | cash | real_estate | commodity | crypto
# allocation:  optional look-through mix for multi-asset funds (must sum to 1)
# diversified: true when the fund holds many issuers, so its weight is not single-company risk
# risk:        1 (lowest) .. 10 (highest), a simple educational risk rating
#
# Expense ratios live in the expense_ratios section below, one entry per fund:
#   ratio:       annual fee as a fraction (0.0003 = 0.03%)
#   status:      verified (read from the provider's official page on verified_on) | VERIFY
#   as_of:       date the provider states for the figure, or null if the page states none
#   source_url:  the official provider page or document where the figure was read
# Stocks have no fund fee. Tickers not listed here are classified from live overview data.

