# Exceptions to the 10% additional tax on early distributions (before age 59½), by account
# type, as listed on the IRS page below (reviewed 11-Dec-2025). "plans" means qualified
# workplace plans such as 401(k) and 403(b). yes | no | n/a (doesn't come up for that type).
early_withdrawal_exceptions:
  source_url: https://www.irs.gov/retirement-plans/plan-participant-employee/retirement-topics-exceptions-to-tax-on-early-distributions
  status: verified
  verified_on: 2026-10-04
  items:
    - {key: age_59_half, label: "Reaching age 59½", plans: "yes", iras: "yes"}
    - {key: separation_age_55, label: "Leaving the employer during or after the year you turn 55 (50 for public safety employees in a governmental plan), the \"Rule of 55\"", plans: "yes", iras: "no"}
    - {key: first_time_home, label: "First-time home purchase (up to $10,000)", plans: "no", iras: "yes"}
    - {key: higher_education, label: "Qualified higher education expenses", plans: "no", iras: "yes"}
    - {key: health_insurance_unemployed, label: "Health insurance premiums while unemployed", plans: "no", iras: "yes"}
    - {key: birth_or_adoption, label: "Birth or adoption (up to $5,000 per child)", plans: "yes", iras: "yes"}
    - {key: disability, label: "Total and permanent disability", plans: "yes", iras: "yes"}
    - {key: death, label: "Distributions to a beneficiary after the owner's death", plans: "yes", iras: "yes"}
    - {key: medical_expenses, label: "Unreimbursed medical expenses above 7.5% of adjusted gross income", plans: "yes", iras: "yes"}
    - {key: equal_payments, label: "A series of substantially equal periodic payments", plans: "yes", iras: "yes"}
    - {key: emergency_expense, label: "Emergency personal expense (up to $1,000, one per year)", plans: "yes", iras: "yes"}
    - {key: domestic_abuse, label: "Domestic abuse victim (up to $10,000 or 50% of the account)", plans: "yes", iras: "yes"}
    - {key: disaster, label: "Federally declared disaster (up to $22,000)", plans: "yes", iras: "yes"}
    - {key: terminal_illness, label: "Terminal illness", plans: "yes", iras: "n/a"}
    - {key: qdro, label: "Payments to a former spouse or dependent under a court order (QDRO)", plans: "yes", iras: "n/a"}
    - {key: irs_levy, label: "An IRS levy on the account", plans: "yes", iras: "yes"}
    - {key: military_reservist, label: "Qualified military reservists called to active duty", plans: "yes", iras: "yes"}

# When required minimum distributions (RMDs) start, by date of birth (SECURE 2.0 Act).
# The final regulations in this bulletin set the ages; they left people born in 1959
# unaddressed (the law's wording was ambiguous), and the proposed regulations printed in the
# same bulletin (REG-103529-23) set 73 for them, as Congress's committees had said it meant.
rmd_ages:
  source_url: https://www.irs.gov/irb/2024-33_IRB
  status: verified
  verified_on: 2026-10-04
  first_rmd_due: >-
    The first RMD is due by April 1 of the year after the year you reach your RMD age; each
    later one by December 31. Workplace plans may let you wait until you retire if you are
    still working, and Roth IRAs (and, from 2024, Roth 401(k)s) have no RMDs for the owner.
  schedule:
    - {born_before: 1949-07-01, age: 70.5}
    - {born_from: 1949-07-01, born_before: 1951-01-01, age: 72}
    - {born_from: 1951-01-01, born_before: 1959-01-01, age: 73}
    - {born_from: 1959-01-01, born_before: 1960-01-01, age: 73, note: "set by the IRS's 2024 proposed regulations; the law's wording left this birth year unclear"}
    - {born_from: 1960-01-01, age: 75}

accounts:
  traditional_401k:
    name: Traditional 401(k)
    contributions: Pre-tax (lowers taxable income now)
    growth: Tax-deferred
    withdrawals: Taxed as ordinary income
    limit_figures: [employee_401k_deferral_limit, employee_401k_catch_up_50_plus, employee_401k_catch_up_60_to_63]
    early_withdrawal: Generally a 10% additional tax before age 59½. Some exceptions differ from IRAs, e.g. leaving the job in or after the year you turn 55 is a plan-only exception, while first-time home and education exceptions are IRA-only.
    required_distributions: Yes, starting at age 73 or 75 depending on birth year (later if still working and the plan allows)
    notes: Many employers match part of contributions, which is extra money toward retirement.
  roth_401k:
    name: Roth 401(k)
    contributions: After-tax (no deduction now)
    growth: Tax-free
    withdrawals: Tax-free if qualified (generally age 59½ and account open 5+ years)
    limit_figures: [employee_401k_deferral_limit, employee_401k_catch_up_50_plus]
    early_withdrawal: Earnings may be taxed and penalized if withdrawn early
    required_distributions: No lifetime required distributions for Roth 401(k)s starting in 2024
    notes: Shares the same employee limit as the traditional 401(k).
  traditional_ira:
    name: Traditional IRA
    contributions: Possibly tax-deductible, depending on income and workplace plan coverage
    growth: Tax-deferred
    withdrawals: Taxed as ordinary income (deductible contributions and earnings)
    limit_figures: [ira_contribution_limit, ira_catch_up_50_plus]
    early_withdrawal: Generally a 10% additional tax before age 59½. IRA-only exceptions include a first-time home purchase (up to $10,000) and higher education; the age-55 job-separation exception doesn't apply to IRAs.
    required_distributions: Yes, starting at age 73 or 75 depending on birth year
    notes: The IRA limit is shared between traditional and Roth IRAs.
  roth_ira:
    name: Roth IRA
    contributions: After-tax; eligibility phases out at higher incomes
    growth: Tax-free
    withdrawals: Contributions can come out any time; earnings are tax-free if qualified
    limit_figures: [ira_contribution_limit, ira_catch_up_50_plus, roth_ira_phase_out_single, roth_ira_phase_out_married_joint]
    early_withdrawal: Earnings withdrawn early may be taxed and penalized
    required_distributions: None for the original owner
    notes: Often discussed for people who expect higher tax rates later.
  hsa:
    name: Health Savings Account (HSA)
    contributions: Pre-tax or deductible (requires a high-deductible health plan)
    growth: Tax-free
    withdrawals: Tax-free for qualified medical expenses
    limit_figures: [hsa_limit_self_only, hsa_limit_family, hsa_catch_up_55_plus]
    early_withdrawal: Non-medical withdrawals before 65 are taxed plus a 20% additional tax
    required_distributions: None
    notes: Sometimes called triple tax-advantaged when used for medical costs.
  plan_529:
    name: 529 Education Savings Plan
    contributions: After-tax federally (some states offer deductions)
    growth: Tax-free
    withdrawals: Tax-free for qualified education expenses
    limit_figures: [gift_tax_annual_exclusion]
    early_withdrawal: Earnings on non-qualified withdrawals are taxed plus a 10% additional tax
    required_distributions: None
    notes: No federal annual contribution limit; large gifts interact with gift tax rules.
  taxable_brokerage:
    name: Taxable Brokerage Account
    contributions: After-tax, no limit
    growth: Dividends and realized gains are taxed each year
    withdrawals: Only gains are taxed; long-term gains get lower rates
    limit_figures: [long_term_holding_period_years, capital_loss_deduction_limit, wash_sale_window_days]
    early_withdrawal: No age restrictions
    required_distributions: None
    notes: Flexible, and losses can offset gains (tax-loss harvesting).
